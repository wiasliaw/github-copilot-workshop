<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="app-header">
          <div class="title-row">
            <div>
              <p class="eyebrow">今日安排</p>
              <h1 id="page-title">待辦清單</h1>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"></button>
          </div>
          <p class="subtitle">把想完成的事情，一件一件放在眼前。</p>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來要完成什麼？"
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit">新增</button>
        </form>

        <nav class="filter-nav" aria-label="篩選待辦事項">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <div class="list-area">
          <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
          <p class="empty-state" id="empty-state"></p>
        </div>

        <footer class="app-footer">
          <span id="remaining-count">未完成：0 項</span>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
